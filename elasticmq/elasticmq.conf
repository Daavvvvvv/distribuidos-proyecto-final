include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  # Igual que en infra: el mensaje reaparece a los 30 s y tras 3 recepciones va a la DLQ.
  notificaciones {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "notificaciones-dlq"
      maxReceiveCount = 3
    }
  }
  notificaciones-dlq {}

  # Cola aparte para las pruebas automáticas, así no se mezclan con la que consume el worker local.
  notificaciones-test {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "notificaciones-test-dlq"
      maxReceiveCount = 3
    }
  }
  notificaciones-test-dlq {}

  # Pruebas del worker: visibilidad de 1 s para que "reaparece y va a la DLQ al 3er intento" tarde segundos.
  notificaciones-worker-test {
    defaultVisibilityTimeout = 1 second
    deadLettersQueue {
      name = "notificaciones-worker-test-dlq"
      maxReceiveCount = 3
    }
  }
  notificaciones-worker-test-dlq {}
}
