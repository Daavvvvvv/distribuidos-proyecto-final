# Balanceador local: reparte entre las 2 réplicas de la API, igual que el ALB en AWS.
events {}

http {
  upstream api {
    server api-1:3000 max_fails=1 fail_timeout=5s;
    server api-2:3000 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_read_timeout 15s;

      # Si una réplica cae a mitad de una solicitud, se reintenta en la otra, INCLUSO un POST.
      # Es seguro porque la inscripción es idempotente: si la primera alcanzó a hacer COMMIT, el
      # reintento la ve y responde 200; si no, Postgres hizo ROLLBACK y el reintento la procesa.
      proxy_next_upstream error timeout http_502 non_idempotent;
      proxy_next_upstream_tries 2;
    }
  }
}
